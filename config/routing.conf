server {
	server_name vasper;
	root /home/astro/Desktop/vasper/data/;
	listen 3000;
	host 127.0.0.1;
	client_max_body_size 100000000000;
	index index.html;
	upload_path uploads/;

	error_page 500 error_pages/500.html;

	location / {
		root /home/astro/Desktop/vasper/data/vasper_website;
		autoindex on;
		index index.html;
		allow_methods POST DELETE GET;
	}

	location /auto {
		root /home/astro/Desktop/vasper/data;
		autoindex on;
		allow_methods POST DELETE GET;
	}
	
	# Error here
	location /auto/main {
		root /home/astro/Desktop/vasper/data/vasper_website;
		index index.html;
		autoindex on;
		allow_methods POST DELETE GET;
	}
}
